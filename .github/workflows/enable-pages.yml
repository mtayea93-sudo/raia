name: enable-pages
on:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:
permissions:
  pages: write
  contents: read
  id-token: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"main","path":"/"}}'
